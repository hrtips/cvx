# yaml-language-server: $schema=https://raw.githubusercontent.com/hrtips/cvx/main/schema/v1/layout.schema.json
# ── Single-Column Layout (ATS) ────────────────────────────────────────────────
# Plain single-column layout optimised for Applicant Tracking Systems.
# No sidebar, no decorative elements. Maximum parsability.
# ─────────────────────────────────────────────────────────────────────────────

template: single-column

# No `geometry:` block: page size and margin come from the theme and are not
# settable per CV yet. The keys that used to sit here were ignored entirely.

pages:
  first:
    main:
      - header-ats
      - summary
      - experience
      - education
      - certifications
      - publications
      - competencies
      - languages
      - achievements
      - referees
