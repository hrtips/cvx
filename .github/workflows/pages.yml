name: Deploy landing page

# Publishes site/index.html to https://hrtips.github.io/cvx/.
# Images are copied from assets/ at build time so they aren't duplicated in git.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - llms.txt
      - assets/hero-two-column.png
      - assets/hero-ats.png
      - assets/brand/**
      - .github/workflows/pages.yml
      # gpt/version.json is generated from package.json below, so a release
      # commit (which bumps the version) must redeploy the page — otherwise the
      # Custom GPT action would keep reporting the previous release.
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages (self-enable on first run)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/cvx-i18n.js _site/cvx-i18n.js   # EN/hi/ta/si translations loaded by index.html
          cp assets/hero-two-column.png _site/hero-two-column.png
          cp assets/hero-ats.png _site/hero-ats.png
          cp assets/brand/icons/cvx-icon-256x256.png _site/icon.png
          cp llms.txt _site/llms.txt   # the redesign's prompts send assistants to this origin
          mkdir -p _site/gpt
          cp site/gpt/openapi.json _site/gpt/openapi.json
          # Published so the GPT's instructions can be copied straight from a URL.
          # They live in a file of their own because pasting them out of a longer
          # document is how they end up over the builder's 8000-char limit.
          cp site/gpt/instructions.txt _site/gpt/instructions.txt
          ls -la _site

      # ── Custom GPT endpoints ──────────────────────────────────────────────
      # The bundle is fetched from the RELEASE rather than rebuilt here, so what
      # a GPT receives is provably the published bytes. `releases/latest` is a
      # public URL, so this needs no token.
      #
      # Note what this makes possible: because the GPT downloads the bundle at
      # run time, its Action schema and instructions name no version, and a new
      # CVX release needs no change to the GPT at all. A Knowledge attachment
      # cannot do that — there is no API to update one, so every release would
      # otherwise mean re-uploading a file by hand.
      - name: Generate gpt/version.json and gpt/bundle.json from the latest release
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$(curl -sSfL "https://api.github.com/repos/$REPO/releases/latest" | jq -r .tag_name)"
          echo "latest release: $TAG"
          # Downloaded under its real name: gpt-endpoints.js takes the delivered
          # filename from the path, and the GPT's instructions name that file.
          curl -sSfL -O \
            "https://github.com/$REPO/releases/latest/download/cvx.bundle.min.js.zip"
          node scripts/gpt-endpoints.js \
            --bundle cvx.bundle.min.js.zip --version "$TAG" --out _site
          rm cvx.bundle.min.js.zip
          ls -la _site/gpt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
