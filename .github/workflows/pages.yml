name: Deploy landing page

# Publishes site/index.html to https://hrtips.github.io/cvx/.
# Images are copied from assets/ at build time so they aren't duplicated in git.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - llms.txt
      - assets/hero-two-column.png
      - assets/hero-ats.png
      - assets/brand/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Configure Pages (self-enable on first run)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/cvx-i18n.js _site/cvx-i18n.js   # EN/hi/ta/si translations loaded by index.html
          cp assets/hero-two-column.png _site/hero-two-column.png
          cp assets/hero-ats.png _site/hero-ats.png
          cp assets/brand/icons/cvx-icon-256x256.png _site/icon.png
          cp llms.txt _site/llms.txt   # the redesign's prompts send assistants to this origin
          ls -la _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
