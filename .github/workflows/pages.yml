name: Deploy landing page

# Publishes site/index.html to https://hrtips.github.io/cvx/.
# Images are copied from assets/ at build time so they aren't duplicated in git.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - llms.txt
      - docs/ai-guide.md
      - docs/cv-schema.md
      - assets/hero-two-column.png
      - assets/hero-ats.png
      - assets/brand/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages (self-enable on first run)
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/cvx-i18n.js _site/cvx-i18n.js   # EN/hi/ta/si translations loaded by index.html
          cp assets/hero-two-column.png _site/hero-two-column.png
          cp assets/hero-ats.png _site/hero-ats.png
          cp assets/brand/icons/cvx-icon-256x256.png _site/icon.png
          cp llms.txt _site/llms.txt   # the redesign's prompts send assistants to this origin
          # Served from THIS origin so an assistant that was handed the site URL can
          # follow through in one hop. Fetching raw.githubusercontent.com is a
          # second host, which some fetchers will not do — and the instruction block
          # on index.html links to these relative paths.
          cp docs/ai-guide.md _site/ai-guide.md
          cp docs/cv-schema.md _site/cv-schema.md
          # The project privacy statement, at BOTH /privacy and /privacy/ so either
          # form of the URL resolves.
          cp site/privacy.html _site/privacy.html
          mkdir -p _site/privacy
          cp site/privacy.html _site/privacy/index.html

          ls -la _site

      # ── Serve the runnable bundle from THIS origin ────────────────────────
      # The point is the hostname, not convenience. A github.com URL is a
      # tool-routing signal: an assistant that sees one reaches for its GitHub
      # connector, which reads repository and release metadata but does not follow
      # the binary release-asset redirect — and then reports that the sandbox
      # cannot download, which is false. Observed on a real run.
      #
      # Prose telling it otherwise loses to the signal, so the signal goes: for
      # EXECUTION the documented URL is hrtips.github.io/cvx/download/…, which
      # looks like what it is, a public file over HTTP. GitHub Releases stay the
      # source of truth and keep serving humans, provenance and history.
      #
      # Copied from the release rather than committed, so no binary enters git
      # history and what the site serves is provably the published bytes.
      - name: Publish the bundle for direct download
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$(curl -sSfL "https://api.github.com/repos/$REPO/releases/latest" | jq -r .tag_name)"
          VERSION="${TAG#v}"
          echo "publishing bundle from $TAG"

          mkdir -p "_site/download/$TAG"
          curl -sSfL -o _site/download/cvx.bundle.min.js.zip \
            "https://github.com/$REPO/releases/latest/download/cvx.bundle.min.js.zip"
          cp _site/download/cvx.bundle.min.js.zip "_site/download/$TAG/cvx.bundle.min.js.zip"

          SHA="$(sha256sum _site/download/cvx.bundle.min.js.zip | awk '{print $1}')"
          printf '%s  cvx.bundle.min.js.zip\n' "$SHA" > _site/download/cvx.bundle.min.js.zip.sha256
          cp _site/download/cvx.bundle.min.js.zip.sha256 "_site/download/$TAG/cvx.bundle.min.js.zip.sha256"

          # One machine-readable file for "what is current" — enough for update
          # discovery without scraping HTML or the Releases API.
          cat > _site/download/latest.json <<EOF
          {
            "version": "$VERSION",
            "node": ">=20",
            "bundle": "https://hrtips.github.io/cvx/download/cvx.bundle.min.js.zip",
            "versionedBundle": "https://hrtips.github.io/cvx/download/$TAG/cvx.bundle.min.js.zip",
            "sha256": "$SHA",
            "run": "unzip -o -q cvx.bundle.min.js.zip && node cvx.bundle.min.js --version",
            "docs": "https://hrtips.github.io/cvx/ai-guide.md",
            "sourceRepository": "https://github.com/$REPO"
          }
          EOF

          # A zip that is not a zip would be worse than a 404: it would fail inside
          # the user's sandbox instead of here.
          unzip -t -q _site/download/cvx.bundle.min.js.zip
          ls -la _site/download

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
