name: Publish

# Stable release:  push a version tag (v1.2.0) → npm publish (latest)
# Canary release:  run manually from the Actions tab → npm publish --tag next
#                  versioned <version>-next.<short-sha>, safe to test via
#                  `npx @hrtips/cvx@next` without touching latest.
#
# Requires the NPM_TOKEN_MAKECV secret (npm granular token, read/write packages).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm --provenance attestation via GitHub OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `cache: npm` here on purpose: a release job restoring a shared npm
      # cache is a cache-poisoning vector into a published artifact. Publishes
      # are rare — a clean `npm ci` is worth it. The residual low-confidence
      # finding (setup-node in a release job) has no cache to poison:
      # zizmor: ignore[cache-poisoning]
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test

      - name: Stamp canary version
        if: github.event_name == 'workflow_dispatch'
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version")-next.$(git rev-parse --short HEAD)"

      - name: Publish canary (--tag next)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_MAKECV }}

      - name: Publish stable
        if: github.event_name == 'push'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_MAKECV }}
